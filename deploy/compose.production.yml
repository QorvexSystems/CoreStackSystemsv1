name: solucionesautomotrizcyr

services:
  api:
    image: corestack/solucionesautomotrizcyr-api:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
    container_name: solucionesautomotrizcyr-api
    init: true
    restart: unless-stopped
    cpus: 0.65
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 192m
    pids_limit: 128
    env_file: /opt/corestack/apps/solucionesautomotrizcyr/secrets/api.env
    environment:
      IMAGE_STORAGE_DRIVER: local
      IMAGE_STORAGE_DIR: /app/uploads
      IMAGE_STORAGE_PUBLIC_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    volumes:
      - /opt/corestack/apps/solucionesautomotrizcyr/uploads:/app/uploads
    ports:
      - "10.0.0.3:4003:4000"
    networks:
      - customer
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: corestack/solucionesautomotrizcyr-web:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
    container_name: solucionesautomotrizcyr-web
    init: true
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 1024m
    memswap_limit: 1024m
    mem_reservation: 128m
    pids_limit: 256
    environment:
      NODE_ENV: production
      XDG_CONFIG_HOME: /tmp/chromium-config
      XDG_CACHE_HOME: /tmp/chromium-cache
    ports:
      - "10.0.0.3:3003:3000"
    networks:
      - customer
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => { if (r.status >= 500) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  customer:
    name: solucionesautomotrizcyr-network
