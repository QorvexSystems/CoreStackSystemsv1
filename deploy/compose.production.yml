name: hotelancla

services:
  api:
    image: corestack/hotelancla:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        API_INTERNAL_URL: http://api:4000
    container_name: hotelancla-api
    init: true
    restart: unless-stopped
    cpus: 0.65
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 192m
    pids_limit: 128
    env_file: /opt/corestack/apps/hotelancla/secrets/api.env
    ports:
      - "10.0.0.3:4004:4000"
    networks:
      - customer
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: corestack/hotelancla:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: hotelancla-web
    init: true
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      API_INTERNAL_URL: http://api:4000
    command: ["./apps/web/node_modules/.bin/next", "start", "apps/web", "--port", "3000", "--hostname", "0.0.0.0"]
    ports:
      - "10.0.0.3:3004:3000"
    networks:
      - customer
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => { if (r.status >= 500) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/apps/web/.next/cache:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  website:
    image: corestack/hotelancla:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: hotelancla-website
    init: true
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 128m
    pids_limit: 128
    env_file: /opt/corestack/apps/hotelancla/secrets/website.env
    command: ["./apps/website/node_modules/.bin/next", "start", "apps/website", "--port", "3001", "--hostname", "0.0.0.0"]
    ports:
      - "10.0.0.3:3005:3001"
    networks:
      - customer
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r => { if (r.status >= 500) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/apps/website/.next/cache:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  customer:
    name: hotelancla-network
