# ALLPA public origins. Public traffic is proxied through Cloudflare.

server {
    listen 80;
    listen [::]:80;
    server_name allpa.corestack-systems.com allpa-api.corestack-systems.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name allpa.corestack-systems.com;

    ssl_certificate /etc/letsencrypt/live/allpa.corestack-systems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allpa.corestack-systems.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20M;
    access_log /var/log/nginx/allpa-web-access.log corestack_tenant;
    error_log /var/log/nginx/allpa-web-error.log warn;

    location / {
        proxy_pass http://10.0.0.3:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name allpa-api.corestack-systems.com;

    ssl_certificate /etc/letsencrypt/live/allpa.corestack-systems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allpa.corestack-systems.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20M;
    access_log /var/log/nginx/allpa-api-access.log corestack_tenant;
    error_log /var/log/nginx/allpa-api-error.log warn;

    location / {
        proxy_pass http://10.0.0.3:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
