# Exact public DGII communication endpoints only. No /fe/ wildcard and no
# internal fiscal routes are forwarded.
location = /fe/autenticacion/api/semilla {
    limit_except GET { deny all; }
    proxy_pass https://10.0.0.1:8444;
    include /etc/nginx/snippets/rivnu-fiscal-receiver-proxy.conf;
}

location = /fe/autenticacion/api/validacioncertificado {
    limit_except POST { deny all; }
    proxy_pass https://10.0.0.1:8444;
    include /etc/nginx/snippets/rivnu-fiscal-receiver-proxy.conf;
}

# Portal currently renders this capitalization; keep one exact compatibility alias.
location = /fe/autenticacion/api/ValidacionCertificado {
    limit_except POST { deny all; }
    proxy_pass https://10.0.0.1:8444;
    include /etc/nginx/snippets/rivnu-fiscal-receiver-proxy.conf;
}

# Commercial-approval certification uses this third exact capitalization.
location = /fe/autenticacion/api/validacionCertificado {
    limit_except POST { deny all; }
    proxy_pass https://10.0.0.1:8444;
    include /etc/nginx/snippets/rivnu-fiscal-receiver-proxy.conf;
}

location = /fe/recepcion/api/ecf {
    limit_except POST { deny all; }
    proxy_pass https://10.0.0.1:8444;
    include /etc/nginx/snippets/rivnu-fiscal-receiver-proxy.conf;
